[package]
name = "grpc"
version = "0.1.0"
edition = "2021"
description = "gRPC server wrapping the mem_weaver index"

[[bin]]
name = "mem-weaver-server"
path = "src/main.rs"

[dependencies]
common = { path = "../common", features = ["s3"] }
index = { path = "../index" }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
rand = "0.8"
memmap2 = { workspace = true }
object_store = { workspace = true, features = ["aws"] }
bytes = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
vector = { path = "../vector" }

[build-dependencies]
tonic-build = "0.12"
