apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mem-weaver.fullname" . }}
  labels:
    {{- include "mem-weaver.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mem-weaver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mem-weaver.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mem-weaver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: {{ .Values.env.LISTEN_ADDR | quote }}
            - name: DATA_DIR
              value: {{ .Values.env.DATA_DIR | quote }}
            {{- if .Values.s3.enabled }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_PREFIX
              value: {{ .Values.s3.prefix | quote }}
            {{- if .Values.s3.secretName }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretName }}
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretName }}
                  key: secret-access-key
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 30
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mem-weaver.fullname" . }}
      {{- end }}
