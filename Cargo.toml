[workspace]
members = [
    "crates/common",
    "crates/index",
    "crates/mem",
    "crates/vector",
]
resolver = "2"

[workspace.dependencies]
memmap2 = "0.9"
wide = "0.7"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
criterion = "0.5"
tracing = "0.1"
object_store = "0.11"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs", "io-util", "macros"] }
bytes = "1"
futures = "0.3"
